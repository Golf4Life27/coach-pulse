name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# akb-dashboard/package.json has no "engines" field pinning a Node version,
# so this workflow targets Node 22 (current LTS-track) as instructed.
env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: akb-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: akb-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        # Verified locally: `next build` succeeds with zero env vars set —
        # no dummy/fake secrets are required for the build to pass here.
        run: npx next build
